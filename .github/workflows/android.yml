
name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Build Android wrapper
        working-directory: android_wrapper
        run: gradle --no-daemon :app:assembleDebug
       
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RFM-Brawl-APK
          path: android_wrapper/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
